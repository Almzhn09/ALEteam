steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '--target', 'tools', '-t', 'aleteam-cloud-tools:build', '.']
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deploy/cloud-run/Dockerfile', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
timeout: 1800s
