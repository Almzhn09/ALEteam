name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: archive_test
          POSTGRES_USER: archive
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archive -d archive_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://archive:ci-only-ephemeral-password@localhost:5432/archive_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - name: Source-inspired discovery planning holdout
        run: npm run evaluate:discovery
      - name: Synthetic aggregate quality report
        run: |
          mkdir -p .local/assistant-quality
          npm run report:quality -- --input data/artur/quality-aggregate-example.json --output .local/assistant-quality/example.json
      # Build does not use DATABASE_URL or auth/LLM secrets.
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:cms
      - run: npm run test:catalog
      - run: npm run test:imports
      - run: npm run test:uploads
      - name: Published CMS sources in the assistant
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium)"
          test -n "$browser_path"
          CHROMIUM_PATH="$browser_path" npm run test:cms-assistant
      - name: Multilingual semantic catalog acceptance
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium)"
          test -n "$browser_path"
          CHROMIUM_PATH="$browser_path" npm run test:semantic
          npm run evaluate:semantic
      - run: npm run evaluate:artur
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run evaluate:search
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run evaluate:local
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run evaluate:dialog
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Real browser flow and accessibility
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium)"
          test -n "$browser_path"
          CHROMIUM_PATH="$browser_path" npm run test:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-browser-report
          path: |
            .local/release/report.json
            .local/release/screenshots
            .local/cms-assistant
            .local/semantic-catalog
            .local/assistant-quality
            .local/uploads
            .local/imports
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the standalone application
        run: docker build --target runtime -t aleteam:local .
      - name: Build migration and seed tools
        run: docker build --target tools -t aleteam-tools:local .
      - name: Check persistence, backup and restore in isolated projects
        run: node tests/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-validation-report
          path: .local/deploy-validation.json
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm run ocr:setup
      - name: Measure actual recognition on original RU and KK sheets
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium)"
          test -n "$browser_path"
          CHROMIUM_PATH="$browser_path" npm run evaluate:ocr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-quality-report
          path: data/ocr/results.json
